name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no actions/setup-python here. The suite runs against the
      # system interpreter so that the apt packages below are importable, which
      # is also the configuration a Debian user actually gets.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-argon2 \
            python3-cryptography \
            python3-gi \
            gir1.2-gtk-3.0 \
            xvfb

      - name: Record which backends are present
        run: |
          python3 -c "import sys; print('python', sys.version)"
          python3 -c "import argon2; print('argon2-cffi', argon2.__version__)" || echo "argon2-cffi absent"
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)" || echo "cryptography absent"
          python3 -c "from cryptography.hazmat.primitives.kdf import argon2 as a; print('cryptography argon2 module present')" || echo "cryptography has no argon2 module"

      # xvfb-run because the GUI tests construct widgets, which needs a display.
      - name: Test suite
        run: xvfb-run -a python3 -m unittest discover tests -v
